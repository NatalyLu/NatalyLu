name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snake-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate snake SVG
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Generate contribution snake
        uses:  Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23321a10&color_dots=%23fff8f1,%23edaa65,%23e7680f,%23a73404,%237f2709
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23321a10&color_dots=%2317110c,%23321a10,%237f2709,%23a73404,%23edaa65

      - name: Upload generated snake artifact
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snake-svg
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish snake to output branch
    runs-on: ubuntu-latest
    needs: generate

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Download generated snake artifact
        uses: actions/download-artifact@v4
        with:
          name: contribution-snake-svg
          path: dist

      - name: Copy updated SVG files
        run: |
          cp dist/github-contribution-grid-snake.svg output/
          cp dist/github-contribution-grid-snake-dark.svg output/

      - name: Commit and push changes
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update contribution snake"
          git push
